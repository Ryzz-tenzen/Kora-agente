<style>
/* Layout: libro contable vivo — barra de evento arriba, pestañas de trabajo, tarjeta de asiento con Debe / Haber como pieza central */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e7ecea; --ink:#16231f; --muted:#5a6a65; --line:#cfd8d5;
  --accent:#0d6b58; --accent-ink:#ffffff; --accent-soft:#d6ebe5;
  --debe:#1f5fa8; --debe-soft:#dce8f6; --haber:#a35a12; --haber-soft:#f6e6d4;
  --ok:#1d7a3e; --ok-soft:#dcf0e2; --warn:#9a6a00; --warn-soft:#f7ecd0; --bad:#b3261e; --bad-soft:#f8dcda;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --c1:#2a78d6; --c2:#eb6834; --grid:#e3e8e6; --axis:#c3ccc9;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --sunk:#1d2a26; --ink:#e3ece9; --muted:#93a6a0; --line:#2c3b37;
  --accent:#3fbf9f; --accent-ink:#06231c; --accent-soft:#163a31;
  --debe:#7fb0ee; --debe-soft:#17283d; --haber:#e8a866; --haber-soft:#352514;
  --ok:#5fcf86; --ok-soft:#133222; --warn:#e3b54a; --warn-soft:#33290f; --bad:#f08a82; --bad-soft:#3a1a18; --c1:#3987e5; --c2:#d95926; --grid:#26332f; --axis:#3a4a45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --sunk:#1d2a26; --ink:#e3ece9; --muted:#93a6a0; --line:#2c3b37;
  --accent:#3fbf9f; --accent-ink:#06231c; --accent-soft:#163a31;
  --debe:#7fb0ee; --debe-soft:#17283d; --haber:#e8a866; --haber-soft:#352514;
  --ok:#5fcf86; --ok-soft:#133222; --warn:#e3b54a; --warn-soft:#33290f; --bad:#f08a82; --bad-soft:#3a1a18; --c1:#3987e5; --c2:#d95926; --grid:#26332f; --axis:#3a4a45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand h1{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.evbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.evbar label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input,button,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
select:focus,input:focus,button:focus-visible,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.status{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.tipo-real{background:var(--accent-soft);color:var(--accent)} .chip.tipo-proy{background:var(--haber-soft);color:var(--haber)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:12px 0 18px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-stretch:90%;font-size:18px;margin:0 0 4px;font-weight:700}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.qt{display:flex;gap:8px}
.qt input{flex:1;font-family:var(--f-mono);font-size:15px;padding:11px 12px}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.examples button{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border:0;border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
@media (max-width:480px){.form{grid-template-columns:minmax(0,1fr)}}
/* tarjeta de asiento */
.asiento{margin-top:14px;border:1px dashed var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
.asiento .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.dh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dh > div{border-radius:8px;padding:10px 12px;min-width:0}
.dh .d{background:var(--debe-soft)} .dh .h{background:var(--haber-soft)}
.dh .lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dh .d .lab{color:var(--debe)} .dh .h .lab{color:var(--haber)}
.dh .acc{font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.dh .code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.amount{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;margin-top:10px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.issues{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.issues li{font-size:13px;color:var(--warn)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
/* tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sec td{background:var(--sunk);font-weight:700}
tr.tot td{font-weight:700;border-top:1.5px solid var(--ink)}
tr.big td{font-weight:800;border-top:1.5px solid var(--ink);border-bottom:3px double var(--ink)}
td.ind{padding-left:24px}
.neg{color:var(--bad)}
.stmts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
.stmts h3,.block h3{font-family:var(--f-display);font-stretch:90%;font-size:16px;margin:0 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:19px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.rules td:first-child{font-family:var(--f-mono);white-space:nowrap}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.op{background:var(--accent-soft);color:var(--accent)} .pill.inv{background:var(--debe-soft);color:var(--debe)} .pill.fin{background:var(--haber-soft);color:var(--haber)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.photo .pinfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.photo-btn{display:inline-flex;align-items:center;gap:6px}
a{color:var(--accent)}
details.newev{margin-top:10px}
details.newev summary{cursor:pointer;font-weight:600;color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Fase 1: control ---- */
.lines{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
.lines td{border:0;padding:4px 6px;border-bottom:1px dashed var(--line)}
.lines td.dcol{color:var(--debe)} .lines td.hcol{color:var(--haber)}
.alerts{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);border-left-width:4px}
.alerts li.bad{border-left-color:var(--bad)} .alerts li.warn{border-left-color:var(--warn)} .alerts li.info{border-left-color:var(--debe)}
.alerts .lv{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;min-width:64px}
.alerts li.bad .lv{color:var(--bad)} .alerts li.warn .lv{color:var(--warn)} .alerts li.info .lv{color:var(--debe)}
.steps{display:grid;gap:10px;list-style:none;margin:0;padding:0;counter-reset:st}
.steps > li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;counter-increment:st}
.steps .sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.steps .st{font-weight:700}
.steps .st::before{content:counter(st) ". ";color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.row .field{flex:1 1 150px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}
.card h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .v{background:var(--accent)} .meter .c{background:var(--haber)}
.meter .ok{background:var(--ok)} .meter .warn{background:var(--warn)} .meter .bad{background:var(--bad)}
.pres td.n input{width:120px;text-align:right}
.inv td.n input{width:96px;text-align:right}
.tour{position:fixed;inset:0;z-index:70;pointer-events:none}
.tour .spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,20,17,.55);outline:3px solid var(--accent);pointer-events:none}
.tour .tip{position:fixed;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:14px;pointer-events:auto}
.tour .tip b{font-family:var(--f-display);font-size:16px;display:block;margin-bottom:4px}.tour .tip p{margin:0 0 10px;font-size:14px}
.tour .tip .k-row{display:flex;gap:6px;justify-content:space-between;align-items:center}
.guia-fases{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.guia-paso{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.guia-paso .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.guia-paso.hecho .ck{background:var(--ok);border-color:var(--ok);color:#fff}.guia-paso.hecho .tt{color:var(--muted);text-decoration:line-through}
.guia-paso .tt{font-weight:600}.guia-paso .ay{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tour .spot{transition:none}}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.mt-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}@media (max-width:820px){.mt-tiles{grid-template-columns:repeat(2,1fr)}}@media (max-width:420px){.mt-tiles{grid-template-columns:1fr}}
.mt-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}
.mt-tile .k{font-size:13px;color:var(--muted);font-weight:600}.mt-tile .v{font-size:26px;font-weight:700;line-height:1.1}
.mt-tile .s{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;align-self:flex-start}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.warn{background:var(--warn-soft);color:var(--warn)}.st.bad{background:var(--bad-soft);color:var(--bad)}.st.na{background:var(--sunk);color:var(--muted)}
.mt-sec{margin:22px 0 8px;font-family:var(--f-display);font-size:19px}
.mt-sec small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.mt-list{display:grid;grid-template-columns:1fr auto;gap:0;margin:0}
.mt-list dt,.mt-list dd{padding:7px 0;border-top:1px solid var(--line);margin:0}.mt-list dd{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mt-list dt small{display:block;color:var(--muted);font-size:12px}
.hb{display:flex;flex-direction:column;gap:2px}
.hb-r{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:4px 2px;border-radius:6px;cursor:default}
.hb-r:hover,.hb-r:focus-visible{background:var(--sunk);outline:none}
.hb-l{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:14px;display:block}.hb-t i{display:block;height:14px;background:var(--c1);border-radius:0 4px 4px 0;min-width:2px}
.hb-r:hover .hb-t i{filter:brightness(1.12)}
.hb-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:64px}
.mt-chart{position:relative;width:100%;min-height:200px}.mt-chart svg{display:block;width:100%;overflow:visible}
.mt-chart text{fill:var(--muted);font-size:11.5px;font-family:var(--f-body)}
.mt-chart .gl{stroke:var(--grid);stroke-width:1}.mt-chart .ax{stroke:var(--axis);stroke-width:1}
.mt-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 6px}
.mt-legend span{display:inline-flex;align-items:center;gap:6px}.mt-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mt-tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:7px 10px;font-size:12.5px;max-width:260px}
.mt-tip b{display:block;font-size:14px}.mt-tip .r{display:flex;align-items:center;gap:6px;color:var(--muted)}.mt-tip .r i{width:12px;height:2px;display:inline-block}
.mt-metas .form{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.kora{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:calc(100vw - 32px)}
.kora .k-btn{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;position:relative}
.kora .k-btn.on{animation:kpulse 1.4s infinite}.kora .k-btn.libre::after{content:"";position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(29,122,62,.55)}70%{box-shadow:0 0 0 16px rgba(29,122,62,0)}100%{box-shadow:0 0 0 0 rgba(29,122,62,0)}}
.kora .k-card{width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:14px}
.kora .k-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.kora .k-head b{font-family:var(--f-display);font-size:17px}
.kora .k-said{font-size:13px;color:var(--muted);margin:6px 0}.kora .k-msg{font-size:14px;margin:6px 0}.kora .k-res{background:var(--sunk);border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
.kora .k-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.kora .k-row input[type=text]{flex:1 1 180px;min-width:0}
@media (prefers-reduced-motion:reduce){.kora .k-btn.on{animation:none;outline:3px solid var(--ok)}}
nav.groups{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 2px}
nav.tabs[hidden] + main{margin-top:18px}
nav.groups button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;color:var(--muted);cursor:pointer}
nav.groups button[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

const TIPO_WEB = { individual:"ind", duo:"duo", grupal:"grupal" };
function parsePedidos(txt){
  const t = String(txt || ""), re = /PEDIDO\s+KONEK/gi, idx = []; let m;

function parsePedido(c){
  const g = lab => { const m = c.match(new RegExp(lab + "\\s*:\\s*([^|\\n]+)", "i")); return m ? m[1].trim() : ""; };

    const esperado = o.fase == null ? 0 : Object.entries(o.tipos).reduce((s,[t,v]) => s + v * precioDe(o.fase, t), 0);
    if (!o.id) err.push("No trae código ORD.");

    if (!boletas) err.push("No trae entradas (ej. «2x Individual»).");

// ================= liquidación de socios =================
function liquidacion(){
  const E = ev(), list = sorted(), f = S.soc;
  const utilidad = list.reduce((s,e) => s + plEffect(e), 0);            // resultado acumulado del evento (con renta si ya está)
  const rentaPend = list.length ? Math.max(autoValue("renta", "9999-12-31"), 0) : 0;
  const disponible = utilidad - rentaPend;                              // utilidad después de impuestos
  const pctRep = Math.min(Math.max(+f.pctRep || 0, 0), 100) / 100;
  const repartir = disponible > 0 ? Math.round(disponible * pctRep) : disponible; // con pérdida se reparte toda la pérdida
  const cap3105 = saldoA(3105, "9999-12-31"), caja = saldoA(1105, "9999-12-31") + saldoA(1110, "9999-12-31");
  const reps = S.repartos.filter(r => r.estado !== "anulado");
  const pctTot = S.socios.reduce((s,x) => s + (+x.participacion || 0), 0);
  const aportesTot = S.socios.reduce((s,x) => s + (+x.aporte || 0), 0);
  const filas = S.socios.map(x => {
    const pc = (+x.participacion || 0) / 100;
    const ya = reps.flatMap(r => r.items || []).filter(i => i.socio === x.id);
    const yaU = ya.reduce((s,i) => s + (+i.utilidad || 0), 0), yaA = ya.reduce((s,i) => s + (+i.aporte || 0), 0), yaJ = ya.reduce((s,i) => s + (+i.ajuste || 0), 0), yaT = ya.reduce((s,i) => s + (+i.total || 0), 0);
    const toca = Math.round(repartir * pc);
    let u = toca - yaU, a = f.devolver ? Math.max((+x.aporte || 0) - yaA, 0) : 0;
    if (u < 0) { a = Math.max(a + u, 0); u = 0; }                      // la pérdida se descuenta del aporte que se devuelve
    const j = num(f.ajustes[x.id]);
    return { x, pc, toca, yaU, yaA, yaJ, yaT, u, a, j, total: u + a + j };
  });
  const ajSum = filas.reduce((s,r) => s + r.j, 0), total = filas.reduce((s,r) => s + r.total, 0);
  const issues = [];
  if (!S.socios.length) issues.push("Agrega los socios del evento.");
  if (S.socios.length && Math.round(pctTot * 100) !== 10000) issues.push(`Las participaciones suman ${String(pctTot).replace(".",",")}% y deben sumar 100%.`);
  if (ajSum !== 0) issues.push(`Los ajustes entre socios suman ${money(ajSum)}: deben sumar $0 (lo que uno paga lo recibe otro).`);
  if (filas.some(r => r.total < 0)) issues.push("A algún socio le queda un valor negativo: revisa los ajustes.");
  if (total > caja) issues.push(`No alcanza el efectivo: hay ${money(caja)} en caja y bancos para entregar ${money(total)}.`);
  if (f.fecha && E && +f.fecha.slice(0,4) !== E.anio) issues.push(`La fecha no es del año del evento (${E.anio}).`);
  if (!total) issues.push("No hay nada pendiente por entregar.");
  const deudas = [2105, 2205, 2404].reduce((s,c) => s + Math.max(saldoA(c, "9999-12-31"), 0), 0), warns = [];
  if (total && deudas > 0 && caja - total < deudas) warns.push(`Quedan ${money(deudas)} en deudas (proveedores, préstamo, impuestos). Después de esta liquidación quedarían ${money(caja - total)} en caja y bancos para pagarlas.`);
  const sumU = filas.reduce((s,r) => s + r.u, 0), sumA = filas.reduce((s,r) => s + r.a, 0), medio = +f.medio;
  const lineas = mergeLines([{c:3705, d:sumU, h:0}, {c:3105, d:sumA, h:0}, {c:medio, d:0, h:sumU + sumA}]);
  return { utilidad, rentaPend, disponible, repartir, pctRep, cap3105, caja, aportesTot, pctTot, filas, total, ajSum, issues, warns, lineas, reps, deudas };
}

// ================= simulador =================
function simDefaults(E){
  const P = E.presupuesto && E.presupuesto.r, src = P || realCuentas(sorted()), aforo = +E.aforo || 1000;
  const precios = E.precios && Array.isArray(E.precios.ind) ? E.precios.ind.filter(x => +x > 0) : [];
  const precio = precios.length ? Math.round(precios.reduce((s,x) => s + +x, 0) / precios.length) : Math.round((+src[417005] || 0) / aforo);
  const bar = +src[413505] || 0, cv = +src[613505] || 0, com = +src[523595] || 0, bol = +src[417005] || 0;
  const fijos = ACC.filter(a => a[2]==="GO" && a[0] !== 523595 && a[0] !== 529596).reduce((s,a) => s + (+src[a[0]] || 0), 0) + (+src[530520] || 0) + (+src[530505] || 0);
  const B = boleteria();
  return { aforo, precio, consumo: Math.round(bar / aforo), margen: bar ? Math.round((1 - cv / bar) * 100) : 60, comision: bol ? Math.round(com / bol * 1000) / 10 : 0,
    patro: +src[417010] || 0, fijos, asistentes: Math.max(B.personas, Math.round(aforo * .8)), base: P ? "presupuesto" : "libro" };
}
function simCalc(x){
  const contrib = x.precio * (1 - x.comision / 100) + x.consumo * x.margen / 100;
  const pe = contrib > 0 ? Math.ceil(Math.max(x.fijos - x.patro, 0) / contrib) : null;
  const util = n => Math.round(n * contrib + x.patro - x.fijos), ing = n => Math.round(n * (x.precio + x.consumo) + x.patro);
  return { contrib, pe, util, ing };
}
function vSimulador(v, E){
  const w = writable(); if (!S.sim || S.sim.ev !== E.id) S.sim = { ev:E.id, ...(E.simulador || simDefaults(E)) };
  const x = S.sim, K = simCalc(x), d = simDefaults(E);
  const occ = [.4,.5,.6,.7,.8,.9,1].map(o => Math.round(x.aforo * o)), deltas = [-.2,-.1,0,.1,.2];
  const field = (k, l, step, suf) => `<label class="field"><span>${l}</span><input type="number" data-sim="${k}" value="${esc(x[k])}" step="${step||1}" min="0">${suf ? `<span class="note" style="margin:0">${suf}</span>` : ""}</label>`;
  v.innerHTML = `<p class="sub">Calcula cuántas personas necesitas para no perder plata y qué pasa si cambias el precio o la asistencia. Arranca con los valores del ${x.base === "presupuesto" ? "presupuesto" : "libro"} de este evento; cámbialos y mira el resultado al instante.</p>
  <div class="kpis">
    <div class="kpi"><div class="k">Aporte por asistente</div><div class="v">${money(K.contrib)}</div><div class="s">Boleta sin comisión + margen de barra</div></div>
    <div class="kpi"><div class="k">Punto de equilibrio</div><div class="v">${K.pe === null ? "n.a." : K.pe + " personas"}</div><div class="s">${K.pe !== null && x.aforo ? `${pct(K.pe / x.aforo)} del aforo` : ""}</div></div>
    <div class="kpi"><div class="k">Utilidad con ${x.asistentes} personas</div><div class="v ${K.util(x.asistentes)<0?"neg":""}">${money(K.util(x.asistentes))}</div><div class="s">Antes de impuestos</div></div>
    <div class="kpi"><div class="k">Ingresos con ${x.asistentes} personas</div><div class="v">${money(K.ing(x.asistentes))}</div></div>
  </div>
  <section class="panel" style="margin-bottom:14px"><h2>Supuestos</h2>
    <div class="form">
      ${field("asistentes","Asistentes esperados")}${field("aforo","Aforo")}${field("precio","Precio promedio por persona (COP)",1000)}${field("comision","Comisión de venta (%)",.5)}
      ${field("consumo","Consumo de barra por persona (COP)",1000)}${field("margen","Margen de la barra (%)")}${field("patro","Patrocinios (COP)",100000)}${field("fijos","Costos fijos del evento (COP)",100000, "Sonido, club, publicidad, personal, shows… todo lo que se paga venda o no")}
    </div>
    <div class="actions"><button class="btn" id="sim-reset">Volver a los valores del ${d.base}</button>${w ? `<button class="btn primary" id="sim-save">Guardar supuestos en el evento</button>` : ""}</div></section>
  <div class="grid2">
  <section class="panel"><h2>Según la asistencia</h2><div class="tbl-wrap"><table><thead><tr><th>Ocupación</th><th class="n">Personas</th><th class="n">Ingresos</th><th class="n">Utilidad</th></tr></thead><tbody>
    ${occ.map(n => `<tr${K.pe !== null && n >= K.pe && n - Math.round(x.aforo*.1) < K.pe ? ` class="tot"` : ""}><td>${pct(n / x.aforo)}</td><td class="n">${n}</td><td class="n">${fmt(K.ing(n))}</td><td class="n ${K.util(n)<0?"neg":""}">${fmt(K.util(n))}</td></tr>`).join("")}
  </tbody></table></div></section>
  <section class="panel"><h2>Precio contra asistencia</h2><p class="sub">Utilidad antes de impuestos si cambias el precio promedio.</p><div class="tbl-wrap"><table><thead><tr><th>Precio</th>${[.6,.8,1].map(o => `<th class="n">${Math.round(x.aforo*o)} pers.</th>`).join("")}</tr></thead><tbody>
    ${deltas.map(dl => { const y = { ...x, precio: Math.round(x.precio * (1 + dl)) }, Ky = simCalc(y); return `<tr${dl === 0 ? ` class="tot"` : ""}><td>${money(y.precio)} ${dl ? `(${dl > 0 ? "+" : ""}${dl*100}%)` : ""}</td>${[.6,.8,1].map(o => { const u = Ky.util(Math.round(x.aforo*o)); return `<td class="n ${u<0?"neg":""}">${fmt(u)}</td>`; }).join("")}</tr>`; }).join("")}
  </tbody></table></div></section></div>`;
  v.querySelectorAll("[data-sim]").forEach(i => i.onchange = () => { x[i.dataset.sim] = Math.max(+i.value || 0, 0); render(); });

    try { await S.db.doc(`eventos/${S.evId}`).update({ simulador:data }); await hist("simulador", `Guardó supuestos: ${x.asistentes} personas, precio ${money(x.precio)}, punto de equilibrio ${K.pe ?? "n.a."}`); toast("Supuestos guardados"); } catch (err) { toast(errMsg(err)); } };
}

async function shrink(file){
  try { const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", 0.85)); } catch (e) { return file; }
}

  ["nums","cant","cobrado","precio"].forEach(k => { const el = $("#b-" + k); if (el) el.onchange = () => { bf[k === "cant" ? "cantidad" : k] = el.value; render(); }; });
  $("#b-save").onclick = async () => {
    if (issues.length) return; const btn = $("#b-save"); btn.disabled = true;
    try {
      let asientoId = null, n = null;
      if (bf.modo === "venta") { const r = await saveEntry({ plantilla:"liquidacion", fecha:bf.fecha, lineas, total: lineas.reduce((s,l)=>s+l.d,0),
          desc:`Venta de boletas ${TIPOS[bf.tipo].l} ${fases[+bf.fase]} · ${P.nombre}${parsed.nums.length ? " · N° " + fmtNums(parsed.nums) : ""}`, fuente:"Boletería" }, { punto:P.id, noPhoto:true });
        asientoId = r.id; n = r.n; }
      await S.db.collection(`eventos/${S.evId}/liquidaciones`).add({ punto:P.id, fecha:bf.fecha, fase:+bf.fase, tipo:bf.tipo, numeros:fmtNums(parsed.nums), nums:parsed.nums, cantidad:cant, precio, total,
        comision, cobrado, medio:+bf.medio, pendiente, cortesia: bf.modo === "cortesia", historico: hist_, asientoId, asientoN:n, estado:"activa", creado:new Date().toISOString(), autor:S.uid || null });
      await hist(bf.modo === "venta" ? "boletería" : hist_ ? "boletería histórica" : "cortesías", `${P.nombre}: ${cant} ${TIPOS[bf.tipo].l}${parsed.nums.length ? " (" + fmtNums(parsed.nums) + ")" : ""}${bf.modo==="venta" ? " · " + money(total) : ""}`, n);
      toast(bf.modo === "venta" ? `Venta registrada (asiento N° ${n})` : hist_ ? "Venta histórica registrada" : "Cortesías registradas"); bf.nums = ""; bf.cantidad = ""; bf.cobrado = ""; bf.precio = ""; render();
    } catch (err) { toast(errMsg(err)); btn.disabled = false; }

  $("#b-savepr").onclick = async () => {

  const cok = $("#c-ok"); if (cok) cok.onclick = async () => { const p = S.puntos.find(x => x.id === cok.dataset.p), val = num($("#c-val").value), medio = +$("#c-medio").value; if (!val) return;
    try { const r = await saveEntry({ plantilla:"cobro", fecha:defaultDate(), lineas:[{c:medio,d:val,h:0},{c:1305,d:0,h:val}], total:val, desc:`Cobro de boletas a ${p.nombre}`, fuente:"Boletería" }, { punto:p.id, noPhoto:true });
      S.cobro = null; toast(`Cobro registrado (asiento N° ${r.n})`); render(); } catch (err) { toast(errMsg(err)); } };
  const psel = $("#p-sel"); psel.onchange = () => { const p = S.puntos.find(x => x.id === psel.value) || {}; $("#p-nombre").value = p.nombre || ""; $("#p-tipo").value = p.tipo || "patrocinador"; $("#p-rangos").value = p.rangos || ""; $("#p-cupo").value = p.cupoCortesia || 0; $("#p-com").value = p.comisionPct || 0; };
  $("#p-save").onclick = async () => {
    const nombre = $("#p-nombre").value.trim(); if (!nombre) { toast("Ponle nombre al punto."); return; }

    </div>

  <section class="panel"><h2>Cajas abiertas</h2>
    ${abiertas.length ? abiertas.map(c => { const k = cajaCalc(c), cnt = (S.arqueo && S.arqueo.id === c.id) ? S.arqueo : null;
      const contado = cnt ? DENOMS.reduce((s,d) => s + d * num(cnt.d[d]), 0) + num(cnt.monedas) : 0;

        ${cnt ? `<div class="denoms">${DENOMS.map(d => `<label class="field"><span>${money(d)}</span><input type="number" min="0" data-den="${d}" value="${esc(cnt.d[d]||"")}" placeholder="billetes"></label>`).join("")}<label class="field"><span>Monedas (COP)</span><input type="number" min="0" id="a-mon" value="${esc(cnt.monedas||"")}"></label></div>
          <div class="kv"><span>Contado</span><b>${money(contado)}</b><span>Diferencia</span><b style="color:${contado-k.esperado<0?"var(--bad)":contado-k.esperado>0?"var(--warn)":"var(--ok)"}">${money(contado - k.esperado)}</b></div>
          <label class="field" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="a-cons" ${cnt.cons!==false?"checked":""}><span style="text-transform:none;letter-spacing:0;font-size:13px">Consignar lo contado al banco al cerrar</span></label>
          <div class="actions"><button class="btn primary" id="a-ok" data-id="${esc(c.id)}" ${w ? "" : "disabled"}>Cerrar caja</button><button class="btn ghost" id="a-no">Cancelar</button></div>`
        : `<div class="actions"><button class="btn" data-arq="${esc(c.id)}" ${w ? "" : "disabled"}>Hacer arqueo y cerrar</button></div>`}</div>`; }).join("") : `<p class="note">No hay cajas abiertas.</p>`}
  </section></div>
  <h3 style="font-family:var(--f-display);margin:22px 0 10px">Cajas cerradas</h3>
  ${cerradas.length ? `<div class="tbl-wrap"><table><thead><tr><th>Caja</th><th>Responsable</th><th>Fecha</th><th class="n">Base</th><th class="n">Esperado</th><th class="n">Contado</th><th class="n">Diferencia</th></tr></thead><tbody>
    ${cerradas.map(c => `<tr><td>${esc(c.nombre)}</td><td>${esc(c.responsable||"")}</td><td>${dmy(c.fecha)}</td><td class="n">${fmt(c.base)}</td><td class="n">${fmt(c.esperado)}</td><td class="n">${fmt(c.contado)}</td><td class="n ${c.diferencia<0?"neg":""}">${c.diferencia ? fmt(c.diferencia) : "Cuadra"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">Todavía no hay cajas cerradas.</p>`}`;

// ---------- Control y cierre ----------

  const abiertas = S.cajas.filter(c => c.estado === "abierta").length;
  const B = boleteria(), pendPuntos = B.res.reduce((s,r) => s + Math.max(r.pendiente,0), 0);
  const renta = X ? autoValue("renta", X.endB) : 0;

  <ol class="steps">
    <li><div class="sh"><span class="st">Pasar la preventa a ingreso</span>${st(pre <= 0)}</div>
      <span class="note" style="margin:0">Saldo de preventa (2705) al ${dmy(fe)}: <b>${money(pre)}</b>.</span>
      ${pre > 0 && w ? `<div><button class="btn sm primary" id="z1">Registrar ${money(pre)} como ingreso por boletería</button></div>` : ""}</li>
    <li><div class="sh"><span class="st">Aplicar los anticipos al gasto</span>${st(ant <= 0 || depChk)}</div>

      ${ant > 0 && !depChk && w ? `<div class="row"><label class="field"><span>Gasto al que se aplica</span><select id="z2c">${GASTOS.map(c => `<option value="${c}">${c} ${esc(accName(c))}</option>`).join("")}</select></label><label class="field"><span>Valor</span><input type="number" id="z2v" value="${ant}"></label><button class="btn sm primary" id="z2">Aplicar</button><button class="btn sm" id="z2d">Es un depósito por devolver</button></div>` : ""}</li>
    <li><div class="sh"><span class="st">Registrar el costo de lo vendido en barra</span>${st(barra === 0 || costoMes > 0)}</div>
      <span class="note" style="margin:0">Ventas de barra del mes: <b>${money(barra)}</b> · costo registrado: <b>${money(costoMes)}</b> · inventario en libros: <b>${money(invSaldo)}</b>.</span>
      ${barra > 0 && costoMes === 0 && w ? `<div class="row"><label class="field"><span>Inventario que quedó (conteo, al costo)</span><input type="number" id="z3i" value="${esc(cf.invFinal||"")}"></label><span class="note">Costo = inventario en libros − lo que quedó = <b>${money(costoCalc)}</b></span><button class="btn sm primary" id="z3" ${costoCalc > 0 ? "" : "disabled"}>Registrar costo</button></div>` : ""}</li>
    <li><div class="sh"><span class="st">Cerrar todas las cajas</span>${st(abiertas === 0)}</div><span class="note" style="margin:0">${abiertas ? `${abiertas} caja(s) abierta(s). Ciérralas en la pestaña Cajas.` : "Todas las cajas están cerradas."}</span></li>

  <div class="tbl-wrap"><table><thead><tr><th>Persona</th><th>Última vez</th><th>Rol</th><th>Compartido como</th></tr></thead><tbody>
    <tr><td><b>Tú</b></td><td class="mono">—</td><td>Administrador (dueño del agente)</td><td>Dueño</td></tr>
    ${otros.map(m => { const rol = (eq.roles || {})[m.id] || eq.defecto || "lector", pide = NIVEL_PIDE[rol], tiene = m.nivel, rk = { view:0, interact:1, admin:2, owner:3 };
      const aviso = !tiene ? `<span class="note" style="margin:0">Se sabrá la próxima vez que abra</span>` : rk[tiene] > rk[pide] ? `<span class="pill warn">⚠ Más de lo necesario: pásalo a ${NIVEL_L[pide]}</span>` : rk[tiene] < rk[pide] ? `<span class="pill warn">⚠ No le alcanza: súbelo a ${NIVEL_L[pide]}</span>` : `<span class="pill ok">✓ ${NIVEL_L[tiene]}</span>`;
      return `<tr><td>${esc(S.names[m.id] || "Persona sin nombre visible")}</td><td class="mono">${m.visto ? esc(new Date(m.visto).toLocaleString("es-CO", {dateStyle:"short", timeStyle:"short"})) : ""}</td>
      <td><select data-rol="${esc(m.id)}" aria-label="Rol"><option value="">Por defecto (${ROLES_APP[eq.defecto || "lector"].l})</option>${opts((eq.roles || {})[m.id] || "")}</select></td><td>${tiene && rk[tiene] === rk[pide] ? aviso : `${tiene ? esc(NIVEL_L[tiene]) + "<br>" : ""}${aviso}`}</td></tr>`; }).join("")}
  </tbody></table></div>
  ${otros.length ? "" : `<p class="note">Todavía nadie más ha abierto el agente. Compártelo desde el menú Compartir de la página y cada persona aparecerá aquí.</p>`}
  <p class="note">Los roles los cambias solo tú. El nivel «Compartido como» se cambia en el menú Compartir de la página; se actualiza aquí cuando la persona vuelve a abrir el agente.</p>`;
  const save = async data => { try { await S.db.doc("config/equipo").set({ roles:{ ...(eq.roles || {}) }, defecto: eq.defecto || "lector", ...data }); toast("Permisos guardados"); } catch (err) { toast("Solo el dueño del agente puede cambiar los permisos."); } };
  $("#eq-def").onchange = e => save({ defecto:e.target.value });
  v.querySelectorAll("[data-rol]").forEach(sel => sel.onchange = () => { const roles = { ...(eq.roles || {}) }; if (sel.value) roles[sel.dataset.rol] = sel.value; else delete roles[sel.dataset.rol]; save({ roles }); });
}
function vHistorial(v){
  const ids = [...new Set(S.hist.map(h => h.autor).filter(Boolean))].filter(id => !(id in S.names));
  if (ids.length && S.user && S.user.profiles) { ids.forEach(id => S.names[id] = ""); S.user.profiles(ids).then(ps => { ids.forEach(id => S.names[id] = (ps && ps[id] && ps[id].name) || ""); if (S.tab === "historial") render(); }).catch(() => {}); }
  v.innerHTML = `<p class="sub">Todo lo que se registra, reversa, abre o cierra queda aquí, con quién lo hizo y cuándo.</p>
  ${S.hist.length ? `<div class="tbl-wrap"><table><thead><tr><th>Fecha y hora</th><th>Acción</th><th>Detalle</th><th>Quién</th></tr></thead><tbody>
  ${S.hist.map(h => `<tr><td class="mono" style="white-space:nowrap">${esc(new Date(h.ts).toLocaleString("es-CO", {dateStyle:"short", timeStyle:"short"}))}</td><td><span class="pill">${esc(h.accion)}</span></td><td>${esc(h.detalle)}</td><td>${esc((h.autor && S.names[h.autor]) || (h.autor ? "Usuario" : "—"))}</td></tr>`).join("")}
  </tbody></table></div>` : `<div class="panel empty">Todavía no hay movimientos en el historial de este evento. Los asientos cargados de los archivos no aparecen aquí.</div>`}`;
}

// ---------- Reglas ----------
function vReglas(v){
  const nm = x => x==="M" ? "Caja o Bancos (o mixto)" : x==="G" ? "Cuenta de gasto" : `${x} ${accName(x)}`;
  v.innerHTML = `<div class="stmts">
  <div class="block"><h3>Reglas de operación</h3><p class="sub">Cada operación siempre produce el mismo asiento. Las palabras clave son las que reconoce el escrito rápido (y luego la voz).</p>
  <div class="tbl-wrap"><table class="rules"><thead><tr><th>Operación</th><th>Debe</th><th>Haber</th><th>Palabras clave</th></tr></thead><tbody>
  ${R.filter(r => !r.manual).map(r => `<tr><td style="font-family:var(--f-body);white-space:normal"><b>${esc(r.l)}</b>${r.auto?`<div class="note" style="margin:0">Valor por fórmula</div>`:""}</td><td>${esc(nm(r.d))}</td><td>${esc(nm(r.c))}</td><td class="note" style="margin:0">${esc(r.k.join(", "))}</td></tr>`).join("")}
  <tr><td style="font-family:var(--f-body)"><b>Venta de un punto de venta</b></td><td>Caja o Bancos (lo entregado) + Cuentas por cobrar (lo pendiente) + Comisiones</td><td>2705 Preventa</td><td class="note" style="margin:0">Pestaña Boletería</td></tr>
  <tr><td style="font-family:var(--f-body)"><b>Cortesía a patrocinador</b></td><td colspan="2">Sin asiento: el dinero es del punto. Cuenta para el aforo y el control de numeración.</td><td class="note" style="margin:0">Pestaña Boletería</td></tr>
  <tr><td style="font-family:var(--f-body)"><b>Faltante / sobrante de caja</b></td><td>5295 Faltantes / 1105 Caja</td><td>1105 Caja / 4250 Sobrantes</td><td class="note" style="margin:0">Cierre de caja</td></tr>
  </tbody></table></div>
  <p class="note">Fórmulas automáticas: <b>Evento realizado</b> = saldo de la 2705 a la fecha. <b>Depreciación</b> = costo del equipo ÷ 60 meses. <b>Renta</b> = tasa × utilidad acumulada − renta ya provisionada. <b>4x1000</b> = 0,4% de lo que sale del banco.</p></div>
  <div class="block"><h3>Plan de cuentas</h3><div class="tbl-wrap"><table class="rules"><thead><tr><th>Código</th><th>Cuenta</th><th>Grupo</th></tr></thead><tbody>
  ${ACC.map(([c,n,g]) => `<tr><td>${c}</td><td style="font-family:var(--f-body)">${esc(n)}</td><td>${({AC:"Activo corriente",ANC:"Activo no corriente",PC:"Pasivo corriente",PAT:"Patrimonio",ING:"Ingreso",OI:"Otro ingreso",CV:"Costo",GO:"Gasto operacional",GF:"Gasto financiero",IMP:"Impuesto"})[g]}</td></tr>`).join("")}
  </tbody></table></div></div></div>`;
}

// ================= datos =================
function normAsiento(id, x){
  const lineas = Array.isArray(x.lineas) && x.lineas.length ? x.lineas.map(l => ({c:+l.c, d:+l.d||0, h:+l.h||0})).filter(l => l.c)
    : [{c:+x.debito, d:+x.valor||0, h:0},{c:+x.credito, d:0, h:+x.valor||0}].filter(l => l.c);
  return { id, n:+x.n||0, fecha:String(x.fecha||""), desc:String(x.desc||""), lineas, total: lineas.reduce((s,l) => s+l.d, 0), plantilla:x.plantilla, fuente:x.fuente||"",
    soporte: typeof x.soporte === "string" ? x.soporte : "", estado:x.estado || "activo", revierte:x.revierte || null, revierteN:x.revierteN, reversadoN:x.reversadoN,
    punto:x.punto || null, caja:x.caja || null, cierreCaja: !!x.cierreCaja, proveedor:x.proveedor || null, patrocinio:x.patrocinio || null, conciliado:x.conciliado || null };
}
function subscribeEvent(){
  S.unsubs.forEach(u => { try { u(); } catch(e) {} }); S.unsubs = [];
  S.asientos = []; S.puntos = []; S.liqs = []; S.cajas = []; S.prods = []; S.movs = []; S.gente = []; S.pagosP = []; S.socios = []; S.repartos = []; S.comp = []; S.patro = []; S.ingresos = []; S.sim = null; S.conc = null; S.hist = []; S.confirm = null; S.arqueo = null; S.cobro = null; S.manual = null;
  if (!S.evId) { render(); return; }
  try { localStorage.setItem("kotic-ev", S.evId); } catch(e) {}
  const base = `eventos/${S.evId}`;
  const sub = (path, fn, q) => { const c = S.db.collection(path); S.unsubs.push((q ? q(c) : c).onSnapshot(snap => { fn(snap.docs.map(d => ({ id:d.id, ...d.data() }))); S.ver++; renderVivo(); }, () => renderVivo())); };
  sub(`${base}/asientos`, rows => { S.asientos = rows.map(r => normAsiento(r.id, r)).filter(x => x.fecha && x.lineas.length >= 2); });
  sub(`${base}/puntos`, rows => { S.puntos = rows.sort((a,b) => (a.orden||0) - (b.orden||0)); });
  sub(`${base}/liquidaciones`, rows => { S.liqs = rows; });
  sub(`${base}/productos`, rows => { S.prods = rows.sort((a,b) => (a.orden||0) - (b.orden||0) || String(a.nombre).localeCompare(String(b.nombre))); });
  sub(`${base}/inventario`, rows => { S.movs = rows; });
  sub(`${base}/personal`, rows => { S.gente = rows.sort((a,b) => String(a.rol).localeCompare(String(b.rol)) || String(a.nombre).localeCompare(String(b.nombre))); });
  sub(`${base}/pagosPersonal`, rows => { S.pagosP = rows; });
  sub(`${base}/socios`, rows => { S.socios = rows.sort((a,b) => (a.orden||0) - (b.orden||0) || String(a.nombre).localeCompare(String(b.nombre))); });
  sub(`${base}/repartos`, rows => { S.repartos = rows; });
  sub(`${base}/compromisos`, rows => { S.comp = rows; });
  sub(`${base}/patrocinios`, rows => { S.patro = rows.sort((a,b) => (+b.valor||0) - (+a.valor||0)); });
  sub(`${base}/ingresos`, rows => { S.ingresos = rows; });
  sub(`${base}/cajas`, rows => { S.cajas = rows.sort((a,b) => String(a.creado).localeCompare(String(b.creado))); });
  sub(`${base}/historial`, rows => { S.hist = rows.sort((a,b) => String(b.ts).localeCompare(String(a.ts))).slice(0, 300); }, c => c.orderBy("ts","desc").limit(300));
  render();
}
document.getElementById("groups").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  let last = null; try { last = localStorage.getItem("kotic-g-" + b.dataset.g); } catch(x) {}
  const tabs = [...document.querySelectorAll(`#tabs button[data-g="${b.dataset.g}"]`)].filter(t => puedeVer(t.dataset.t));
  const t = tabs.find(x => x.dataset.t === last) || tabs[0]; if (!t) return; S.tab = t.dataset.t; saveTab(); render(); });
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.tab = b.dataset.t; saveTab(); render(); });
document.getElementById("ev").addEventListener("change", e => { S.memo = {}; S.evId = e.target.value; S.form.fecha = ""; S.form.caja = ""; S.bol = { ...S.bol, punto:"", fecha:"" }; S.pres = { edit:false, draft:null, base:"", ajuste:0, loading:false }; S.mesLibro = "todos"; subscribeEvent(); });

render();
(async () => {
  const db = await claude.use("db").catch(() => null);
  S.loaded = true; S.db = db;
  if (!db) { render(); return; }
  S.assets = await claude.use("assets").catch(() => null);
  const smp = await claude.use("sample").catch(() => null);
  if (smp) { S.sampleTxt = smp; try { const lim = await smp.limits(); if (lim && lim.images) S.sample = smp; } catch (e) {} }
  const user = await claude.use("user").catch(() => null); S.user = user;
  if (user) { try { S.uid = await user.id(); } catch(e) {} const cw = await user.can("data.write"); if (cw === false) S.canWrite = false;
    try { S.isOwner = !!(await user.isOwner()); } catch(e) {} }
  db.doc("config/equipo").onSnapshot(d => { S.equipo = d.exists ? { roles:{}, defecto:"lector", ...d.data() } : { roles:{}, defecto:"lector" }; renderVivo(); }, () => { S.equipo = { roles:{}, defecto:"lector" }; render(); });
  if (user) { try { S.canEdit = !!(await user.canEdit()); } catch (e) {} }
  if (S.uid) { db.doc(`miembros/${S.uid}`).set({ visto:new Date().toISOString(), nivel: S.isOwner ? "owner" : S.canEdit ? "admin" : S.canWrite === false ? "view" : "interact" }).catch(() => {}); }
  db.doc("respaldo/ultimo").onSnapshot(d => { S.ultResp = d.exists ? d.data() : null; if (S.tab === "inicio") renderVivo(); }, () => {});
  if (S.isOwner) db.collection("miembros").onSnapshot(snap => { S.miembros = snap.docs.map(d => ({ id:d.id, ...d.data() })); if (S.tab === "equipo") render(); }, () => {});
  let saved = null; try { saved = localStorage.getItem("kotic-ev"); } catch(e) {}
  db.collection("proveedores").onSnapshot(snap => { S.proveedores = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => String(a.nombre).localeCompare(String(b.nombre))); S.ver++; renderVivo(); }, () => {});
  setTimeout(() => { if (!S.evCargados) { S.lento = true; render(); } }, 10000);
  db.collection("eventos").onSnapshot(snap => {
    if (!(snap.metadata && snap.metadata.fromCache) || snap.docs.length) { S.evCargados = true; S.lento = false; }
    S.eventos = snap.docs.map(d => ({ id:d.id, ...d.data() })).map(e => ({ ...e, anio:+e.anio, mes:+e.mes||10, tasa: e.tasa ?? .35, vida: e.vida || 60 }))
      .sort((a,b) => (a.orden||0) - (b.orden||0) || a.anio - b.anio);
    if (!S.evId || !S.eventos.some(e => e.id === S.evId)) { S.evId = (saved && S.eventos.some(e => e.id === saved)) ? saved : (S.eventos[0]?.id || null); subscribeEvent(); }
    else render();
  }, () => { S.evCargados = true; render(); });
})();
})();
</script>
